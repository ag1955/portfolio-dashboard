<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AG Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Inter;background:#f4f6f8;margin:0}
header{background:#1a365d;color:#fff;padding:15px;display:flex;justify-content:space-between}
.container{padding:20px;max-width:1500px;margin:auto}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.filters{display:flex;gap:20px}
select{height:120px;width:180px}
.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.top5 div{background:#fffaf0;padding:10px;text-align:center;border-top:4px solid #d69e2e}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
th,td{border:1px solid #e2e8f0;padding:6px}
th{background:#f7fafc}
.table-wrap{max-height:450px;overflow:auto}
.tab{display:none}
.tab.active{display:block}
</style>
</head>

<body>

<header>
<div>
<h2>AG Dashboard</h2>
Period: <b id="periodText"></b>
</div>
<div>
<button onclick="resetAll()">Reset</button>
</div>
</header>

<div class="container">

<div class="card filters">
<div>
Investor<br>
<select id="invF" multiple></select><br>
<button onclick="clearF('invF')">Clear</button>
</div>
<div>
Company<br>
<select id="comF" multiple></select><br>
<button onclick="clearF('comF')">Clear</button>
</div>
<div>
Type<br>
<select id="typF" multiple></select><br>
<button onclick="clearF('typF')">Clear</button>
</div>
</div>

<button onclick="showTab('ins')">Insights</button>
<button onclick="showTab('repo')">Repository</button>

<div id="ins" class="tab active">

<div class="grid">
<div class="card"><div id="pie"></div></div>
<div class="card"><div id="donut"></div></div>
</div>

<div class="card">
<h3 id="topTitle"></h3>
<div id="top5" class="top5"></div>
</div>

<div class="card" id="drillBox" style="display:none">
<input id="drillSearch" placeholder="Search..." oninput="renderDrill()">
<div class="table-wrap">
<table><tbody id="drillBody"></tbody></table>
</div>
</div>

</div>

<div id="repo" class="tab">
<input id="repoSearch" oninput="renderRepo()" placeholder="Search...">
<div class="card">
Total Qty: <b id="tQty"></b> |
Total Value: <b id="tVal"></b>
</div>
<div class="table-wrap">
<table><tbody id="repoBody"></tbody></table>
</div>
</div>

</div>

<script>
const DATA_URL="https://script.googleusercontent.com/macros/echo?user_content_key=AWDtjMVjq0MfxqN3nVfRFzv26s5evN-5m7Qn8Yr6saVnyBArSHVSPM6spfnbbYchG-_705UKGveR7y9g-VNBYsVr3kN84Tir8j7_NWBVPXeSMF9m9GA0uJPDIAweFFHyZP2WEzTsWkxHUPy5EtdUt1ayH44BaOilAlipnvIwaQRJHfnNmymHOrR1OSa8Bw_eAlOLnvve9lbh8SECpVaFmlTymH6-H4GZQcm92up56BEiEFRiKDI2da16SIqsy5KILI5DtYGzDzRk5DceVL_ekfHYvhwKY1wVAA&lib=MLfLtmcdnFe_9PafX9g6m-beUs6YUnKQP";

let raw=[],filtered=[],drill=[];

fetch(DATA_URL).then(r=>r.json()).then(j=>{
raw=j.data;
periodText.innerText=j.period;
initFilters();
apply();
});

const getSel=id=>{
const v=[...document.getElementById(id).selectedOptions].map(o=>o.value);
return v.length?v:null;
};

function initFilters(){
['invF','comF','typF'].forEach(id=>document.getElementById(id).onchange=apply);
fillAll(raw);
}

function fillAll(data){
fill('invF','Investor',data);
fill('comF','Name of the Company',data);
fill('typF','Type',data);
}

function fill(id,key,data){
const sel=document.getElementById(id);
const prev=[...sel.selectedOptions].map(o=>o.value);
const vals=[...new Set(data.map(d=>d[key]))].sort();
sel.innerHTML=vals.map(v=>`<option ${prev.includes(v)?"selected":""}>${v}</option>`).join('');
}

function apply(){
drill=[];
drillBox.style.display="none";

const iv=getSel('invF'),co=getSel('comF'),ty=getSel('typF');

filtered=raw.filter(d=>
(!iv||iv.includes(d.Investor)) &&
(!co||co.includes(d["Name of the Company"])) &&
(!ty||ty.includes(d.Type))
);

fillAll(filtered);
render();
}

function clearF(id){
[...document.getElementById(id).options].forEach(o=>o.selected=false);
apply();
}

function resetAll(){
['invF','comF','typF'].forEach(id=>{
[...document.getElementById(id).options].forEach(o=>o.selected=false);
});
apply();
}

function showTab(t){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.getElementById(t).classList.add('active');
}

function render(){
renderCharts();
renderTop5();
renderRepo();
}

function renderCharts(){
const iv=getSel('invF'),co=getSel('comF');
const total=filtered.reduce((a,b)=>a+b.Value,0)/100000;

let map={},title="";

if(co&&co.length===1){
title="Investor View";
filtered.forEach(d=>{
map[d.Investor]=(map[d.Investor]||0)+d.Value/100000;
});
}else if(iv&&iv.length===1){
title="Company View";
filtered.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+d.Value/100000;
});
}else{
title="Company Concentration";
filtered.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+d.Value/100000;
});
}

Plotly.newPlot(pie,[{labels:Object.keys(map),values:Object.values(map),type:'pie'}]);

pie.on("plotly_click",e=>{
const l=e.points[0].label;
drill=filtered.filter(d=>JSON.stringify(d).includes(l));
drillBox.style.display="block";
renderDrill();
});

const tMap={};
filtered.forEach(d=>tMap[d.Type]=(tMap[d.Type]||0)+d.Value/100000);

Plotly.newPlot(donut,[{labels:Object.keys(tMap),values:Object.values(tMap),type:'pie',hole:0.5}]);

donut.on("plotly_click",e=>{
drill=filtered.filter(d=>d.Type===e.points[0].label);
drillBox.style.display="block";
renderDrill();
});
}

function renderTop5(){
const iv=getSel('invF'),co=getSel('comF');
const base=drill.length?drill:filtered;
const total=base.reduce((a,b)=>a+b.Value,0)/100000;

let map={},qty={},title="";

if(co&&co.length===1){
title="Top Investors";
base.forEach(d=>{
map[d.Investor]=(map[d.Investor]||0)+d.Value/100000;
qty[d.Investor]=(qty[d.Investor]||0)+d.Qty;
});
}else if(iv&&iv.length===1){
title="Top Companies";
base.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+d.Value/100000;
qty[d["Name of the Company"]]=(qty[d["Name of the Company"]]||0)+d.Qty;
});
}else{
title="Top Companies";
base.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+d.Value/100000;
qty[d["Name of the Company"]]=(qty[d["Name of the Company"]]||0)+d.Qty;
});
}

topTitle.innerText=title;

top5.innerHTML=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5)
.map(([k,v])=>{
const pct=total?((v/total)*100).toFixed(1):0;
return `<div><b>${k}</b><br>Qty:${qty[k]}<br>₹${v.toFixed(2)}L<br>${pct}%</div>`;
}).join('');
}

function renderDrill(){
const q=drillSearch.value.toLowerCase();
drillBody.innerHTML=drill.filter(d=>JSON.stringify(d).toLowerCase().includes(q))
.map(d=>`<tr><td>${d.Investor}</td><td>${d["Name of the Company"]}</td><td>${d.Type}</td><td>${d.Qty}</td><td>${d["Rate per share"]}</td><td>${(d.Value/100000).toFixed(2)}</td><td>${d.DOA}</td></tr>`).join('');
}

function renderRepo(){
const q=repoSearch.value.toLowerCase();
const data=filtered.filter(d=>JSON.stringify(d).toLowerCase().includes(q));

repoBody.innerHTML=data.map(d=>`<tr><td>${d.Investor}</td><td>${d["Name of the Company"]}</td><td>${d.Type}</td><td>${d.Qty}</td><td>${d["Rate per share"]}</td><td>${(d.Value/100000).toFixed(2)}</td><td>${d.DOA}</td></tr>`).join('');

tQty.innerText=data.reduce((a,b)=>a+b.Qty,0);
tVal.innerText="₹ "+(data.reduce((a,b)=>a+b.Value,0)/100000).toFixed(2)+" L";
}
</script>

</body>
</html>
