<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AG Group Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{margin:0;font-family:Inter;background:#f4f6f8}
header{background:#1a365d;color:#fff;padding:15px;display:flex;justify-content:space-between}
.container{max-width:1500px;margin:auto;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:20px}
.filters{display:flex;gap:20px;flex-wrap:wrap}
select{width:180px;height:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.top5 div{background:#fffaf0;padding:10px;text-align:center;border-top:4px solid #d69e2e}
.table-wrap{max-height:500px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
th,td{border:1px solid #e2e8f0;padding:6px}
th{background:#f7fafc}
.tab{display:none}
.tab.active{display:block}
.page-break{page-break-before:always}
</style>
</head>

<body>

<header>
<div>
<h2>AG Group Dashboard</h2>
Period: <b id="periodText"></b>
</div>
<div>
<button onclick="exportPDF()">PDF</button>
<button onclick="exportExcel()">Excel</button>
<button onclick="resetAll()">Reset</button><br>
<small id="lastUpdated"></small>
</div>
</header>

<div class="container">

<div class="card filters">
<div>
Investor<br>
<select id="invF" multiple></select><br>
<button onclick="clearF('invF')">Clear</button>
</div>
<div>
Company<br>
<select id="comF" multiple></select><br>
<button onclick="clearF('comF')">Clear</button>
</div>
<div>
Type<br>
<select id="typF" multiple></select><br>
<button onclick="clearF('typF')">Clear</button>
</div>
</div>

<button onclick="showTab('ins')">Insights</button>
<button onclick="showTab('repo')">Repository</button>

<!-- INSIGHTS -->
<div id="ins" class="tab active">

<div class="grid">
<div class="card">
<h3 id="pieTitle">Company Concentration</h3>
<div id="pie"></div>
</div>
<div class="card">
<h3>Investment Mix</h3>
<div id="donut"></div>
</div>
</div>

<div class="card">
<h3 id="topTitle"></h3>
<div id="top5" class="top5"></div>
</div>

<div class="card" id="drillBox" style="display:none">
<h3>Drill Down</h3>
<input id="drillSearch" placeholder="Search..." oninput="renderDrill()">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Investor</th><th>Company</th><th>Type</th>
<th>Qty</th><th>Rate</th><th>Value (₹ L)</th><th>Date</th>
</tr>
</thead>
<tbody id="drillBody"></tbody>
</table>
</div>
</div>

</div>

<!-- REPOSITORY -->
<div id="repo" class="tab">
<input id="repoSearch" placeholder="Search..." oninput="renderRepo()">

<div class="card">
Total Qty: <b id="tQty"></b> |
Total Value: <b id="tVal"></b>
</div>

<div class="table-wrap">
<table id="repoTable">
<thead>
<tr>
<th>Investor</th><th>Company</th><th>Type</th>
<th>Qty</th><th>Rate</th><th>Value (₹ L)</th><th>Date</th>
</tr>
</thead>
<tbody id="repoBody"></tbody>
</table>
</div>
</div>

</div>

<script>

/* ================= STATE ================= */
const DATA_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AWDtjMVNqMyqhV1HMJoXDzxvP4z1fHOxvx_V_5wdWgRnISm8kyxev9i3zlyotfVQR9l1s7EhvYkHdx-qcxxzstBc8wKzpVcRjuLoJ49L-tCYJ0LVGqZk5IKOc_O9ewxondZp-0YU0P0gWEOwiQCTm0yVZk6N5EakM-EKH8-HnlKYpEHMvG79X48UurFsUp32pQrXx2PODZ5sbgNAL8zkvWrCA4NQtVvD8M1yJ5Kfscfyb22wAIBBTQuxV2mX4PNDwfk7OsO5t8X5wKdXMR992IkDOeNCkn0WoA&lib=MLfLtmcdnFe_9PafX9g6m-beUs6YUnKQP";

let rawData=[], filteredData=[], drillData=[];

/* ================= LOAD ================= */
fetch(DATA_URL).then(r=>r.json()).then(j=>{
rawData=j.data||[];
periodText.innerText=j.period||"--";
lastUpdated.innerText=j.lastUpdated||"--";
initFilters();
applyFilters();
});

/* ================= HELPERS ================= */
const s=v=>String(v??"");
const getSel=id=>{
const vals=[...document.getElementById(id).selectedOptions].map(o=>o.value);
return vals.length?vals:null;
};

/* ================= FILTERS ================= */
function initFilters(){
['invF','comF','typF'].forEach(id=>{
document.getElementById(id).onchange=applyFilters;
});
rebuildFilters(rawData);
}

function rebuildFilters(data){
build('invF','Investor',data);
build('comF','Name of the Company',data);
build('typF','Type',data);
}

function build(id,key,data){
const sel=document.getElementById(id);
const prev=[...sel.selectedOptions].map(o=>o.value);
const vals=[...new Set(data.map(d=>s(d[key])))]
.filter(v=>v!=="").sort();

sel.innerHTML=vals.map(v=>`<option ${prev.includes(v)?"selected":""}>${v}</option>`).join('');
}

function applyFilters(){
drillData=[];
drillBox.style.display="none";

const iv=getSel('invF'),co=getSel('comF'),ty=getSel('typF');

filteredData=rawData.filter(d=>
(!iv||iv.includes(s(d.Investor))) &&
(!co||co.includes(s(d["Name of the Company"]))) &&
(!ty||ty.includes(s(d.Type)))
);

rebuildFilters(filteredData);
renderAll();
}

function clearF(id){
[...document.getElementById(id).options].forEach(o=>o.selected=false);
applyFilters();
}

function resetAll(){
drillData=[];
drillBox.style.display="none";
['invF','comF','typF'].forEach(id=>{
[...document.getElementById(id).options].forEach(o=>o.selected=false);
});
applyFilters();
}

/* ================= TABS ================= */
function showTab(t){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.getElementById(t).classList.add('active');
}

/* ================= RENDER ================= */
function renderAll(){
renderCharts();
renderTop5();
renderRepo();
}

/* ================= CHARTS ================= */
function renderCharts(){

const iv=getSel('invF');
const co=getSel('comF');

const total=filteredData.reduce((a,b)=>a+(+b.Value||0),0)/100000;

let map={},labels=[],values=[],others=0;

if(co && co.length===1){
pieTitle.innerText="Investor-wise Holding";
filteredData.forEach(d=>{
map[d.Investor]=(map[d.Investor]||0)+(+d.Value||0)/100000;
});
labels=Object.keys(map);
values=Object.values(map);
}
else if(iv && iv.length===1){
pieTitle.innerText="Company-wise Holding";
filteredData.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+(+d.Value||0)/100000;
});
labels=Object.keys(map);
values=Object.values(map);
}
else{
pieTitle.innerText="Company Concentration";
filteredData.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+(+d.Value||0)/100000;
});

Object.entries(map).forEach(([k,v])=>{
if(total>0 && v/total<0.02) others+=v;
else{labels.push(k);values.push(v);}
});
if(others>0){
labels.push("Others (<2%)");
values.push(others);
}
}

Plotly.newPlot(pie,[{labels,values,type:'pie',hole:0.35}],
{annotations:[{text:"₹ "+total.toFixed(2)+" L",showarrow:false}]});

pie.on("plotly_click",e=>{
const label=e.points[0].label;

drillData=filteredData.filter(d=>
d.Investor===label ||
d["Name of the Company"]===label ||
d.Type===label
);

drillBox.style.display="block";
renderDrill();
});

/* DONUT */
const tMap={};
filteredData.forEach(d=>{
tMap[d.Type]=(tMap[d.Type]||0)+(+d.Value||0)/100000;
});

Plotly.newPlot(donut,[{
labels:Object.keys(tMap),
values:Object.values(tMap),
type:'pie',
hole:0.6
}],{
annotations:[{text:"₹ "+total.toFixed(2)+" L",showarrow:false}]
});

donut.on("plotly_click",e=>{
const label=e.points[0].label;
drillData=filteredData.filter(d=>d.Type===label);
drillBox.style.display="block";
renderDrill();
});
}

/* ================= DRILL ================= */
function renderDrill(){
const q=drillSearch.value.toLowerCase();

const data=drillData.filter(d=>
JSON.stringify(d).toLowerCase().includes(q)
);

drillBody.innerHTML=data.map(d=>`
<tr>
<td>${d.Investor}</td>
<td>${d["Name of the Company"]}</td>
<td>${d.Type}</td>
<td>${d.Qty}</td>
<td>${d["Rate per share"]}</td>
<td>${(+d.Value/100000).toFixed(2)}</td>
<td>${d.DOA}</td>
</tr>`).join('');
}

/* ================= TOP 5 ================= */
function renderTop5(){

const iv=getSel('invF');
const co=getSel('comF');

const base=drillData.length?drillData:filteredData;

const total=base.reduce((a,b)=>a+(+b.Value||0),0)/100000;

let map={},qty={},title="";

if(co && co.length===1){
title="Top Investors";
base.forEach(d=>{
map[d.Investor]=(map[d.Investor]||0)+(+d.Value||0)/100000;
qty[d.Investor]=(qty[d.Investor]||0)+(+d.Qty||0);
});
}
else if(iv && iv.length===1){
title="Top Companies";
base.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+(+d.Value||0)/100000;
qty[d["Name of the Company"]]=(qty[d["Name of the Company"]]||0)+(+d.Qty||0);
});
}
else{
title="Top Companies";
base.forEach(d=>{
map[d["Name of the Company"]]=(map[d["Name of the Company"]]||0)+(+d.Value||0)/100000;
qty[d["Name of the Company"]]=(qty[d["Name of the Company"]]||0)+(+d.Qty||0);
});
}

topTitle.innerText=title;

top5.innerHTML=Object.entries(map)
.sort((a,b)=>b[1]-a[1])
.slice(0,5)
.map(([k,v])=>{
const pct=total>0?((v/total)*100).toFixed(1):0;
return `
<div>
<b>${k}</b><br>
Qty: ${qty[k]}<br>
₹ ${v.toFixed(2)} L<br>
${pct}%
</div>`;
}).join('');
}

/* ================= REPO ================= */
function renderRepo(){
const q=repoSearch.value.toLowerCase();

const data=filteredData.filter(d=>
JSON.stringify(d).toLowerCase().includes(q)
);

repoBody.innerHTML=data.map(d=>`
<tr>
<td>${d.Investor}</td>
<td>${d["Name of the Company"]}</td>
<td>${d.Type}</td>
<td>${d.Qty}</td>
<td>${d["Rate per share"]}</td>
<td>${(+d.Value/100000).toFixed(2)}</td>
<td>${d.DOA}</td>
</tr>`).join('');

const qty=data.reduce((a,b)=>a+(+b.Qty||0),0);
const val=data.reduce((a,b)=>a+(+b.Value||0),0)/100000;

tQty.innerText=qty.toLocaleString();
tVal.innerText="₹ "+val.toFixed(2)+" L";
}

/* ================= EXPORT ================= */
async function exportPDF(){

const pieImg=await Plotly.toImage(pie,{format:"png",width:700,height:500});
const donutImg=await Plotly.toImage(donut,{format:"png",width:700,height:500});

const box=document.createElement("div");

box.innerHTML=`
<h2>AG Group Investment Report</h2>
<p>Period: ${periodText.innerText}</p>

<h3>Company Concentration</h3>
<img src="${pieImg}" style="width:100%">

<h3>Investment Mix</h3>
<img src="${donutImg}" style="width:100%">

<h3>Top 5 Summary</h3>
${top5.innerHTML}

<div class="page-break"></div>

<h3>Repository</h3>
<p>Total Qty: ${tQty.innerText}<br>Total Value: ${tVal.innerText}</p>

${repoTable.outerHTML}
`;

html2pdf().set({
margin:12,
filename:"AG_Report.pdf",
jsPDF:{format:"a3"},
pagebreak:{mode:["css"]}
}).from(box).save();
}

function exportExcel(){
const wb=XLSX.utils.book_new();

const data=(drillData.length?drillData:filteredData).map(d=>({
Investor:d.Investor,
Company:d["Name of the Company"],
Type:d.Type,
Qty:d.Qty,
"Rate per Share":d["Rate per share"],
"Value (₹ L)": (+d.Value/100000).toFixed(2),
Date:d.DOA
}));

XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"Data");
XLSX.writeFile(wb,"AG_Data.xlsx");
}

</script>

</body>
</html>
